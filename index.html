<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gakuran 上帝之眼</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a24; --card: #1d2130;
    --border: #2a2f42; --accent: #7c5cff; --accent2: #ff5c7c;
    --text: #e6e8f0; --dim: #8a90a5; --gold: #ffd166;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; padding: 24px 28px 16px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(90deg, rgba(124,92,255,.08), transparent 40%, rgba(124,92,255,.08));
  }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: .5px; text-align: center; }
  h1 span { color: var(--accent); }
  .sync { font-size: 12px; color: var(--dim,#8a90a5); text-align: center; }
  .controls {
    display: flex; flex-direction: column; align-items: center;
    gap: 10px; padding: 14px 28px;
    position: sticky; top: 0; background: var(--bg);
    z-index: 10; border-bottom: 1px solid var(--border);
  }
  .searchbox { position: relative; width: 100%; max-width: 560px; }
  .searchbox input {
    width: 100%; padding: 11px 14px 11px 40px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-size: 15px; outline: none;
  }
  .searchbox input:focus { border-color: var(--accent); }
  .searchbox::before {
    content: "⌕"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--dim,#8a90a5); font-size: 20px;
  }
  .stats { font-size: 13px; color: var(--dim,#8a90a5); text-align: center; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 16px; padding: 22px 28px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; transition: transform .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(124,92,255,.12); }
  .avatar { width: 100%; aspect-ratio: 1 / 1; background: var(--panel); display: flex; align-items: center; justify-content: center; }
  .avatar .ph { color: var(--dim,#8a90a5); font-size: 12px; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .body { padding: 14px 16px; }
  .name { font-size: 17px; font-weight: 700; }
  .name .uname { color: var(--dim,#8a90a5); font-weight: 400; font-size: 13px; margin-left: 6px; }
  .tags { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
  .tag {
    font-size: 11px; padding: 3px 9px; border-radius: 20px;
    background: rgba(124,92,255,.14); color: var(--accent);
  }
  .tag.gold { background: rgba(255,209,102,.14); color: var(--gold); }
  .tag.pink { background: rgba(53,220,124,.14); color: #4cdf9e; }
  .rarity { display:inline-block; font-size:10px; font-weight:700; padding:1px 7px; border-radius:10px; color:#fff; letter-spacing:.3px; }
  .colors { display:flex; gap:6px; margin-top:8px; align-items:center; }
  .swatch { width:22px; height:22px; border-radius:5px; border:1px solid var(--border); }
  .colors .lbl { font-size:11px; color: var(--dim,#8a90a5); }
  .modal { display:none; position:fixed; inset:0; background:rgba(8,10,16,.75);
    z-index:100; align-items:center; justify-content:center; padding:20px; }
  .modal.open { display:flex; }
  .modal-box { background:var(--panel); border:1px solid var(--border); border-radius:16px;
    max-width:720px; width:100%; max-height:88vh; overflow:auto; padding:22px; position:relative; }
  .modal-close { position:sticky; float:right; background:none; border:none; color:var(--dim,#8a90a5);
    font-size:22px; cursor:pointer; }
  .modal h2 { font-size:20px; margin-bottom:2px; }
  .modal .sub { color:var(--dim,#8a90a5); font-size:13px; margin-bottom:16px; }
  .app-sec { margin-bottom:18px; }
  .app-sec h3 { font-size:13px; color:var(--accent); letter-spacing:.5px; margin-bottom:8px;
    padding-bottom:5px; border-bottom:1px solid var(--border); }
  .app-grid { display:flex; gap:10px; flex-wrap:wrap; }
  .app-item { width:84px; text-align:center; background:var(--card); border:1px solid var(--border);
    border-radius:10px; padding:6px; }
  .app-item img { width:72px; height:72px; object-fit:cover; border-radius:6px; background:var(--bg); }
  .app-item .ai-label { font-size:10px; color:var(--dim,#8a90a5); margin-top:4px; }
  .app-item .ai-id { font-size:9px; color:var(--dim,#8a90a5); }
  .app-item .rarity { margin-top:3px; }
  .plain-item { display:flex; gap:10px; align-items:center; background:var(--card);
    border:1px solid var(--border); border-radius:10px; padding:8px 12px; margin-bottom:6px; flex-wrap:wrap; }
  .plain-item .lbl { font-size:12px; color:var(--dim,#8a90a5); min-width:56px; }
  .plain-item .val { font-size:13px; font-weight:600; }
  .info { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-top: 10px; }
  .info .k { font-size: 11px; color: var(--dim,#8a90a5); }
  .info .v { font-size: 13px; font-weight: 500; }
  .slotrow { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: 12px; }
  .slotrow .lbl { color: var(--dim,#8a90a5); min-width: 52px; }
  .slot {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 4px 10px; font-size: 12px;
  }
  .slot.eq { border-color: var(--accent); color: var(--accent); }
  .empty { text-align: center; padding: 60px; color: var(--dim,#8a90a5); }
  @media (max-width: 640px) { .controls { padding: 12px 16px; } .grid { padding: 14px 16px; } }
</style>
</head>
<body>
<header>
  <h1>👁 Gakuran <span>上帝之眼</span></h1>
  <div class="sync" id="sync"></div>
</header>

<div class="controls">
  <div class="searchbox">
    <input id="q" type="text" placeholder="搜索 Roblox 用户名 / 角色名 / 姓氏 / 制服…" oninput="render()">
  </div>
  <div class="stats" id="stats"></div>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal" onclick="if(event.target===this)closeDetail()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeDetail()">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="rarity.js"></script>
<script>
const DATA = [];
let players = [];

function normalizeId(id) {
  const s = String(id == null ? "" : id);
  return s.replace(/rbxassetid:\/\//g, "");
}

function thumbUrl(uid, size) {
  return "https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=" + uid + "&size=" + size + "&format=Png";
}

function h(cm) {
  if (!cm) return "";
  const m = cm / 100;
  const ft = Math.floor(m / 0.3048);
  const inch = Math.round((m / 0.3048 - ft) * 12);
  return m.toFixed(2) + " m (" + ft + "'" + inch + "\")";
}

function fmt(v) {
  if (v == null || v === 0 || v === "") return "—";
  if (typeof v === "number") return String(v);
  return String(v);
}

function render() {
  const q = (document.getElementById("q").value || "").trim().toLowerCase();
  const g = document.getElementById("grid");
  const list = players.filter(function(p) {
    if (!q) return true;
    var hay = [(p.username||""),(p.display||""),(p.first||""),(p.last||""),
               (p.gender||""),(p.ethnicity||""),(p.grade||""),
               (p.unif1||""),(p.unif2||""),(p.style1||""),(p.style2||"")]
             .join(" ").toLowerCase();
    return hay.indexOf(q) !== -1;
  });

  document.getElementById("stats").textContent =
    list.length + " / " + players.length + " 在线成员";

  if (!list.length) {
    g.innerHTML = '<div class="empty">未找到匹配。换个关键字试试。</div>';
    return;
  }

  g.innerHTML = list.map(p => {
    const face = p.faceAcc || p.faceId;
    const head = p.headId;
    const imgThumb = thumbUrl(p.uid, "352x352");
    const uslot = function(un, eq) {
      if (!un) return '';
      const r = RARITY && RARITY.unif[un];
      const c = r && RARITY.colors[r] || '#888';
      return '<span class="slot' + (eq ? ' eq' : '') + '">' + esc(un) +
        (r ? ' <span class="rarity" style="background:' + c + '">' + r + '</span>' : '') + '</span>';
    };
    const uslots = uslot(p.unif1, p.unifEq == 1) + uslot(p.unif2, p.unifEq == 2);
    const sslot = function(s, eq) {
      if (!s) return '';
      const r = RARITY && RARITY.style && RARITY.style[s];
      const c = r && RARITY.colors && RARITY.colors[r] || '#888';
      return '<span class="slot' + (eq ? ' eq' : '') + '">' + esc(s) +
        (r ? ' <span class="rarity" style="background:' + c + '">' + r + '</span>' : '') + '</span>';
    };
    const sslots = sslot(p.style1, p.styleEq == 1) + sslot(p.style2, p.styleEq == 2);
    const avImg = p.avatar
      ? '<img loading="lazy" src="' + p.avatar + '" onerror="this.parentElement.innerHTML=\'<span style=color:#555>无头像</span>\'">'
      : '<div class="ph">无头像</div>';
    return `<div class="card" onclick="openDetail(${p.uid})" role="button" tabindex="0"
        onkeydown="if(event.key==='Enter')openDetail(${p.uid})">
      <div class="avatar">${avImg}</div>
      <div class="body">
        <div class="name">${esc(p.first || "")} ${esc(p.last || "")}<span class="uname">@${esc(p.username || "")}</span></div>
        <div class="tags">
          <span class="tag"${p.gender==='Female'?' style="color:#4c6ef5;background:rgba(76,110,245,.14)"':''}>${esc(p.gender||"")}</span>
          <span class="tag">${esc(p.ethnicity||"")}</span>
          <span class="tag">${esc(p.grade||"")}</span>
          <span class="tag pink">${esc(p.age!=null?p.age+" 岁":"")}</span>
        </div>
        <div class="info">
          <div><div class="k">身高</div><div class="v">${h(p.heightCm)}</div></div>
          <div><div class="k">制服</div><div class="v">${uslots}</div></div>
          <div><div class="k">战斗风格</div><div class="v">${sslots}</div></div>
          <div><div class="k">UID</div><div class="v">${fmt(p.uid)}</div></div>
        </div>
      </div>
    </div>`;
  }).join("");
}

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ===== 详情面板 =====
function thumbOf(id) {
  id = String(id || '');
  if (RARITY && RARITY.thumbs && RARITY.thumbs[id]) return RARITY.thumbs[id];
  return null;
}
function rarityOf(kind, id) {
  id = String(id || '');
  if (!RARITY) return null;
  if (kind === 'face') return RARITY.face[id] || null;
  return null;
}
function rarityBadge(r) {
  if (!r) return '';
  var c = (RARITY && RARITY.colors && RARITY.colors[r]) || '#888';
  return '<span class="rarity" style="background:' + c + '">' + r + '</span>';
}
function appItem(label, id, rar) {
  id = String(id || '');
  if (!id || id === '0' || id === '') return '';
  var th = thumbOf(id);
  var img = th ? '<img loading="lazy" src="' + th + '" onerror="this.onerror=null;this.style.display=\'none\'">'
               : '<img loading="lazy" src="https://www.roblox.com/asset-thumbnail/image?assetId=' + id + '&width=150&height=150&format=png&quality=100" onerror="this.style.display=\'none\'">';
  return '<div class="app-item">' + img + '<div class="ai-label">' + label + '</div>' +
    (rar ? rarityBadge(rar) : '') + '<div class="ai-id">#' + id + '</div></div>';
}
function sec(title, inner) { return '<div class="app-sec"><h3>' + title + '</h3><div class="app-grid">' + inner + '</div></div>'; }
function sec2(title, inner) { return '<div class="app-sec"><h3>' + title + '</h3>' + inner + '</div>'; }
function plain(p, lbl, val) {
  if (val == null || val === '' || val === 0) return '';
  return '<div class="plain-item"><span class="lbl">' + lbl + '</span><span class="val">' + esc(val) + '</span></div>';
}
function unifSection(p) {
  var r1 = (RARITY && RARITY.unif && RARITY.unif[p.unif1]) || null;
  var r2 = (RARITY && RARITY.unif && RARITY.unif[p.unif2]) || null;
  var eq1 = p.unifEq == 1 ? '（穿着中）' : '';
  var eq2 = p.unifEq == 2 ? '（穿着中）' : '';
  var i1 = p.unif1 ? '<div class="plain-item"><span class="lbl">槽1</span><span class="val">' + esc(p.unif1) + '</span>' + rarityBadge(r1) + ' ' + eq1 + '</div>' : '';
  var i2 = p.unif2 ? '<div class="plain-item"><span class="lbl">槽2</span><span class="val">' + esc(p.unif2) + '</span>' + rarityBadge(r2) + ' ' + eq2 + '</div>' : '';
  return sec2('制服（' + (p.unif1||'') + (p.unif2 ? ' / ' + p.unif2 : '') + '）', i1 + i2);
}
function styleSection(p) {
  var r1 = (RARITY && RARITY.style && RARITY.style[p.style1]) || null;
  var r2 = (RARITY && RARITY.style && RARITY.style[p.style2]) || null;
  var eq1 = p.styleEq == 1 ? '（装备中）' : '';
  var eq2 = p.styleEq == 2 ? '（装备中）' : '';
  var i1 = p.style1 ? '<div class="plain-item"><span class="lbl">槽1</span><span class="val">' + esc(p.style1) + '</span>' + rarityBadge(r1) + ' ' + eq1 + '</div>' : '';
  var i2 = p.style2 ? '<div class="plain-item"><span class="lbl">槽2</span><span class="val">' + esc(p.style2) + '</span>' + rarityBadge(r2) + ' ' + eq2 + '</div>' : '';
  return sec2('战斗风格（' + (p.style1||'') + (p.style2 ? ' / ' + p.style2 : '') + '）', i1 + i2);
}
function openDetail(uid) {
  var p = players.find(function(x){ return x.uid == uid; });
  if (!p) return;
  var R = '';
  // 外貌：脸部 + 肤色/发色
  var skinSw = p.skin ? '<div class="app-item"><div class="swatch" style="width:72px;height:72px;border-radius:6px;background:' + p.skin + '"></div><div class="ai-label">肤色</div><div class="ai-id">' + p.skin + '</div></div>' : '';
  var hairSw = p.hairColor ? '<div class="app-item"><div class="swatch" style="width:72px;height:72px;border-radius:6px;background:' + p.hairColor + '"></div><div class="ai-label">发色</div><div class="ai-id">' + p.hairColor + '</div></div>' : '';
  R += sec('外貌', appItem('脸型', p.faceId, rarityOf('face', p.faceId)) +
                  appItem('发型', p.hairId, null) +
                  skinSw + hairSw);
  // 骨骼
  R += sec2('穿着部位',
    appItem('头饰', p.headId, null) +
    appItem('脸饰', p.faceAcc, null) +
    appItem('颈部', p.neckId, null) +
    appItem('肩部', p.shoulderId, null) +
    appItem('腰部', p.waistId, null) +
    appItem('背部', p.backId, null));
  // 制服
  R += unifSection(p);
  // 风格
  R += styleSection(p);
  // 属性
  R += sec2('属性', plain(p, '制服1', p.unif1) + plain(p, '制服2', p.unif2) +
    plain(p, '风格1', p.style1) + plain(p, '风格2', p.style2) +
    plain(p, '性别', p.gender) + plain(p, '族裔', p.ethnicity) +
    plain(p, '年龄', p.age) + plain(p, '年级', p.grade) + plain(p, 'UID', p.uid));

  document.getElementById('modal-body').innerHTML =
    '<h2>' + (p.first||'') + ' ' + (p.last||'') + '</h2>' +
    '<div class="sub">@' + (p.username||'') + ' · ' + (p.ethnicity||'') + ' · ' + (p.grade||'') + '</div>' + R;
  document.getElementById('modal').classList.add('open');
}
function closeDetail() { document.getElementById('modal').classList.remove('open'); }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeDetail(); });

fetch("data.json").then(r => r.json()).then(d => {
  const src = d.players || d;
  players = src.map(p => {
    const hScale = parseFloat(p.height || p.Height || 1);
    const cm = Math.round((60 + (hScale - 1) * 60) * 2.54);
    return {
      username: p.username, display: p.display,
      first: p.first || p.firstName, last: p.last || p.lastName,
      gender: p.gender, ethnicity: p.ethnicity, age: p.age,
      grade: p.grade, role: p.role,
      heightCm: cm, uid: p.uid,
      skin: p.skin, hairColor: p.hairColor,
      faceId: p.faceId, faceAcc: p.faceAcc, headId: p.headId,
      hairId: p.hairId, neckId: p.neckId, shoulderId: p.shoulderId,
      waistId: p.waistId, backId: p.backId,
      unif1: p.unif1, unif2: p.unif2, unifEq: p.unifEq,
      style1: p.style1, style2: p.style2, styleEq: p.styleEq,
      hunger: p.hunger, thirst: p.thirst,
      avatar: p.avatar
    };
  });
  render();
  const t = new Date((d.captured || Date.now()) * 1000);
  document.getElementById("sync").textContent =
    "数据快照 " + t.toLocaleString() + " · " + players.length + " 人";
}).catch(e => {
  document.getElementById("grid").innerHTML = '<div class="empty">数据加载失败: ' + esc(e.message) + '</div>';
});

document.getElementById("q").addEventListener("input", render);
</script>
</body>
</html>
