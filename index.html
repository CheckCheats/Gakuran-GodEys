<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gakuran 上帝之眼</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a24; --card: #1d2130;
    --border: #2a2f42; --accent: #7c5cff; --accent2: #ff5c7c;
    --text: #e6e8f0; --dim: #8a90a5; --gold: #ffd166;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
  }
  header {
    display: flex; flex-direction: column; align-items: center;
    gap: 6px; padding: 24px 28px 16px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(90deg, rgba(124,92,255,.08), transparent 40%, rgba(124,92,255,.08));
  }
  h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: .5px;
    text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px; }
  h1 .brand { height: 36px; width: auto; display: inline-block; }
  h1 span { color: var(--accent); }
  .sync { font-size: 12px; color: var(--dim,#8a90a5); text-align: center; }
  .controls {
    display: flex; flex-direction: column; align-items: center;
    gap: 10px; padding: 14px 28px;
    position: sticky; top: 0; background: var(--bg);
    z-index: 10; border-bottom: 1px solid var(--border);
  }
  .searchbox { position: relative; width: 100%; max-width: 560px; }
  .searchbox input {
    width: 100%; padding: 11px 14px 11px 40px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-size: 15px; outline: none;
  }
  .searchbox input:focus { border-color: var(--accent); }
  .searchbox::before {
    content: "⌕"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    color: var(--dim,#8a90a5); font-size: 20px;
  }
  .stats { font-size: 13px; color: var(--dim,#8a90a5); text-align: center; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 16px; padding: 22px 28px;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; display: flex; flex-direction: column;
    transition: transform .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(124,92,255,.12); }
  .avatar { width: 100%; aspect-ratio: 3 / 2; background: var(--panel);
    display: flex; align-items: center; justify-content: center;
    border-bottom: 1px solid var(--border); }
  .avatar .ph { color: var(--dim,#8a90a5); font-size: 12px; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .body { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .name { font-size: 17px; font-weight: 700; line-height: 1.3;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 6px; }
  .name .uname { color: var(--dim,#8a90a5); font-weight: 400; font-size: 13px; overflow-wrap: anywhere; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag {
    font-size: 11px; padding: 3px 9px; border-radius: 20px; white-space: nowrap;
    background: rgba(124,92,255,.14); color: var(--accent);
  }
  .tag.girl { background: rgba(76,110,245,.16); color: #6f93ff; }
  .tag.boy  { background: rgba(255,92,124,.14); color: var(--accent2); }
  .tag.gold { background: rgba(255,209,102,.14); color: var(--gold); }
  .tag.pink { background: rgba(255,92,124,.14); color: var(--accent2); }
  .rarity { display: inline-flex; align-items: center; font-size: 10px; font-weight: 700;
    padding: 1px 7px; border-radius: 10px; color: #fff; letter-spacing: .3px; }
  .slot {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 4px 10px; font-size: 12px; white-space: nowrap;
  }
  .slot.eq { border-color: var(--accent); color: var(--accent); }
  .swatch { width: 100%; aspect-ratio: 1 / 1; border-radius: 6px; border: 1px solid var(--border); }
  .info { display: grid; grid-template-columns: 64px 1fr; gap: 8px 10px; margin-top: 2px; }
  .info .k { font-size: 11px; color: var(--dim,#8a90a5); padding-top: 2px; }
  .info .v { font-size: 13px; font-weight: 500; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .meta { font-size: 11px; color: var(--dim,#8a90a5); border-top: 1px solid var(--border);
    padding-top: 8px; margin-top: auto; }
  .modal { display:none; position:fixed; inset:0; background:rgba(8,10,16,.75);
    z-index:100; align-items:center; justify-content:center; padding:20px; }
  .modal.open { display:flex; }
  .modal-box { background:var(--panel); border:1px solid var(--border); border-radius:16px;
    max-width:760px; width:100%; max-height:90vh; overflow:auto; padding:0; position:relative; }
  .modal-close { position:absolute; top:12px; right:14px; z-index:2; width:32px; height:32px;
    border-radius:50%; border:1px solid var(--border); background:rgba(15,17,23,.6);
    color:var(--text); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  .modal-close:hover { border-color:var(--accent); color:var(--accent); }
  .m-head { display:flex; gap:14px; align-items:center; padding:20px 22px 16px;
    border-bottom:1px solid var(--border); }
  .m-head .ava, .m-head .ava-ph { width:64px; height:64px; border-radius:12px;
    object-fit:cover; background:var(--card); border:1px solid var(--border); flex:none; }
  .m-head .ava-ph { display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--dim); }
  .m-head h2 { font-size:20px; margin:0 0 2px; }
  .m-head .sub { color:var(--dim,#8a90a5); font-size:13px; }
  .m-tags { display:flex; gap:6px; flex-wrap:wrap; padding:12px 22px 0; }
  .m-body { padding:4px 22px 22px; }
  .app-sec { margin-top:18px; }
  .app-sec > h3 { font-size:13px; color:var(--accent); letter-spacing:.5px;
    margin:0 0 10px; padding-bottom:6px; border-bottom:1px solid var(--border); }
  .app-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(84px,1fr)); gap:10px; }
  .app-item { text-align:center; background:var(--card); border:1px solid var(--border);
    border-radius:10px; padding:8px 6px; }
  .app-item img { width:100%; aspect-ratio:1/1; border-radius:6px; background:var(--bg); display:block; }
  .app-item .ph { width:100%; aspect-ratio:1/1; border-radius:6px; background:var(--bg);
    display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--dim); }
  .app-item .ai-label { font-size:10px; color:var(--dim,#8a90a5); margin-top:5px; }
  .app-item .ai-id { font-size:9px; color:var(--dim,#8a90a5); }
  .app-item .rarity { margin-top:4px; }
  .kv { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:8px; }
  .plain-item { display:flex; gap:10px; align-items:center; background:var(--card);
    border:1px solid var(--border); border-radius:10px; padding:9px 12px; }
  .plain-item .lbl { font-size:12px; color:var(--dim,#8a90a5); min-width:64px; flex:none; }
  .plain-item .val { font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .chip { font-size:10px; padding:1px 7px; border-radius:10px;
    background:rgba(124,92,255,.16); color:var(--accent); white-space:nowrap; }
  .empty { text-align: center; padding: 60px; color: var(--dim,#8a90a5); }
  @media (max-width: 640px) { .controls { padding: 12px 16px; } .grid { padding: 14px 16px; } }
</style>
</head>
<body>
<header>
  <h1><img class="brand" src="assets/A_minimalist_all_seeing_eye_em_2026-08-06T01-15-23.png" alt="上帝之眼"> <span>上帝之眼</span> <img class="brand" src="assets/gakuran_logo_768x432.png" alt="Gakuran"></h1>
  <div class="sync" id="sync"></div>
</header>

<div class="controls">
  <div class="searchbox">
    <input id="q" type="text" placeholder="搜索 Roblox 用户名 / 角色名 / 姓氏 / 制服…" oninput="render()">
  </div>
  <div class="stats" id="stats"></div>
</div>

<div class="grid" id="grid"></div>

<div class="modal" id="modal" onclick="if(event.target===this)closeDetail()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeDetail()">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<script src="rarity.js"></script>
<script>
const DATA = [];
let players = [];

function normalizeId(id) {
  const s = String(id == null ? "" : id);
  return s.replace(/rbxassetid:\/\//g, "");
}

function thumbUrl(uid, size) {
  return "https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=" + uid + "&size=" + size + "&format=Png";
}

function h(cm) {
  if (!cm) return "";
  const m = cm / 100;
  const ft = Math.floor(m / 0.3048);
  const inch = Math.round((m / 0.3048 - ft) * 12);
  return m.toFixed(2) + " m (" + ft + "'" + inch + "\")";
}

function fmt(v) {
  if (v == null || v === 0 || v === "") return "—";
  if (typeof v === "number") return String(v);
  return String(v);
}

function render() {
  const q = (document.getElementById("q").value || "").trim().toLowerCase();
  const g = document.getElementById("grid");
  const list = players.filter(function(p) {
    if (!q) return true;
    var hay = [(p.username||""),(p.display||""),(p.first||""),(p.last||""),
               (p.gender||""),(p.ethnicity||""),(p.grade||""),
               (p.unif1||""),(p.unif2||""),(p.style1||""),(p.style2||"")]
             .join(" ").toLowerCase();
    return hay.indexOf(q) !== -1;
  });

  document.getElementById("stats").textContent =
    "已收录数据 " + players.length + " NOOB";

  if (!list.length) {
    g.innerHTML = '<div class="empty">未找到匹配。换个关键字试试。</div>';
    return;
  }

  g.innerHTML = list.map(p => {
    const face = p.faceAcc || p.faceId;
    const head = p.headId;
    const imgThumb = thumbUrl(p.uid, "352x352");
    const uslot = function(un, eq) {
      if (!un) return '';
      const r = RARITY && RARITY.unif[un];
      const c = r && RARITY.colors[r] || '#888';
      return '<span class="slot' + (eq ? ' eq' : '') + '">' + esc(un) +
        (r ? '<span class="rarity" style="background:' + c + '">' + r + '</span>' : '') + '</span>';
    };
    const uslots = uslot(p.unif1, p.unifEq == 1) + uslot(p.unif2, p.unifEq == 2);
    const sslot = function(s, eq) {
      if (!s) return '';
      const r = RARITY && RARITY.style && RARITY.style[s];
      const c = r && RARITY.colors && RARITY.colors[r] || '#888';
      return '<span class="slot' + (eq ? ' eq' : '') + '">' + esc(s) +
        (r ? '<span class="rarity" style="background:' + c + '">' + r + '</span>' : '') + '</span>';
    };
    const sslots = sslot(p.style1, p.styleEq == 1) + sslot(p.style2, p.styleEq == 2);
    const avImg = p.avatar
      ? '<img loading="lazy" src="' + p.avatar + '" onerror="this.parentElement.innerHTML=\'<span style=color:#555>无头像</span>\'">'
      : '<div class="ph">无头像</div>';
    return `<div class="card" onclick="openDetail(${p.uid})" role="button" tabindex="0"
        onkeydown="if(event.key==='Enter')openDetail(${p.uid})">
      <div class="avatar">${avImg}</div>
      <div class="body">
        <div class="name">${esc(p.first || "")} ${esc(p.last || "")}<span class="uname">@${esc(p.username || "")}</span></div>
        <div class="tags">
          <span class="tag ${p.gender==='Female'?'girl':(p.gender==='Male'?'boy':'')}">${esc(p.gender||"")}</span>
          <span class="tag">${esc(p.ethnicity||"")}</span>
          <span class="tag gold">${esc(p.grade||"")}</span>
          <span class="tag pink">${esc(p.age!=null?p.age+" 岁":"")}</span>
        </div>
        <div class="info">
          <div class="k">身高</div><div class="v">${h(p.heightCm)}</div>
          <div class="k">制服</div><div class="v">${uslots}</div>
          <div class="k">战斗风格</div><div class="v">${sslots}</div>
        </div>
        <div class="meta">UID ${fmt(p.uid)}</div>
      </div>
    </div>`;
  }).join("");
}

function esc(s) {
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// ===== 详情面板 =====
function thumbOf(id) {
  id = String(id || '');
  if (RARITY && RARITY.thumbs && RARITY.thumbs[id]) return RARITY.thumbs[id];
  return null;
}
function rarityOf(kind, id) {
  id = String(id || '');
  if (!RARITY) return null;
  if (kind === 'face') return RARITY.face[id] || null;
  return null;
}
function rarityBadge(r) {
  if (!r) return '';
  var c = (RARITY && RARITY.colors && RARITY.colors[r]) || '#888';
  return '<span class="rarity" style="background:' + c + '">' + r + '</span>';
}
function appItem(label, id, rar) {
  id = String(id || '');
  if (!id || id === '0' || id === '') return '';
  var th = thumbOf(id);
  var img = th
    ? '<img loading="lazy" src="' + th + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
    : '<img loading="lazy" src="https://www.roblox.com/asset-thumbnail/image?assetId=' + id + '&width=150&height=150&format=png&quality=100" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">';
  return '<div class="app-item">' + img + '<div class="ph" style="display:none">无图</div>' +
    '<div class="ai-label">' + label + '</div>' +
    (rar ? rarityBadge(rar) : '') + '<div class="ai-id">#' + id + '</div></div>';
}
function sec(title, inner) { return '<div class="app-sec"><h3>' + title + '</h3>' + inner + '</div>'; }
function appGrid(inner) { return '<div class="app-grid">' + inner + '</div>'; }
function kv(items) {
  if (!items.length) return '<div class="empty" style="padding:14px">无</div>';
  return '<div class="kv">' + items.map(function(it) {
    return '<div class="plain-item"><span class="lbl">' + it.lbl + '</span>' +
      '<span class="val">' + it.val + (it.rar ? ' ' + rarityBadge(it.rar) : '') +
      (it.eq ? ' <span class="chip">穿着中</span>' : '') + '</span></div>';
  }).join('') + '</div>';
}
function openDetail(uid) {
  var p = players.find(function(x){ return x.uid == uid; });
  if (!p) return;
  var R = '';
  // 外貌：脸型 + 发型 + 肤色/发色
  var skinSw = p.skin ? '<div class="app-item"><div class="swatch" style="background:' + p.skin + '"></div><div class="ai-label">肤色</div><div class="ai-id">' + p.skin + '</div></div>' : '';
  var hairSw = p.hairColor ? '<div class="app-item"><div class="swatch" style="background:' + p.hairColor + '"></div><div class="ai-label">发色</div><div class="ai-id">' + p.hairColor + '</div></div>' : '';
  R += sec('外貌', appGrid(
    appItem('脸型', p.faceId, rarityOf('face', p.faceId)) +
    appItem('发型', p.hairId, null) + skinSw + hairSw));
  // 穿着部位
  R += sec('穿着部位', appGrid(
    appItem('头饰', p.headId, null) + appItem('脸饰', p.faceAcc, null) +
    appItem('颈部', p.neckId, null) + appItem('肩部', p.shoulderId, null) +
    appItem('腰部', p.waistId, null) + appItem('背部', p.backId, null)));
  // 制服
  R += sec('制服', kv([
    p.unif1 ? { lbl: '槽位 1', val: esc(p.unif1), rar: (RARITY && RARITY.unif && RARITY.unif[p.unif1]) || null, eq: p.unifEq == 1 } : null,
    p.unif2 ? { lbl: '槽位 2', val: esc(p.unif2), rar: (RARITY && RARITY.unif && RARITY.unif[p.unif2]) || null, eq: p.unifEq == 2 } : null
  ].filter(Boolean)));
  // 战斗风格
  R += sec('战斗风格', kv([
    p.style1 ? { lbl: '槽位 1', val: esc(p.style1), rar: (RARITY && RARITY.style && RARITY.style[p.style1]) || null, eq: p.styleEq == 1 } : null,
    p.style2 ? { lbl: '槽位 2', val: esc(p.style2), rar: (RARITY && RARITY.style && RARITY.style[p.style2]) || null, eq: p.styleEq == 2 } : null
  ].filter(Boolean)));
  // 档案
  R += sec('档案', kv([
    { lbl: '性别', val: esc(p.gender) }, { lbl: '族裔', val: esc(p.ethnicity) },
    { lbl: '年龄', val: esc(p.age) }, { lbl: '年级', val: esc(p.grade) },
    { lbl: 'UID', val: fmt(p.uid) }
  ]));
  // 头部：头像 + 姓名
  var avSrc = p.avatar ? p.avatar : thumbUrl(p.uid, '150x150');
  var av = '<img class="ava" src="' + avSrc + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' +
    '<div class="ava-ph" style="display:none">无头像</div>';
  document.getElementById('modal-body').innerHTML =
    '<div class="m-head">' + av + '<div><h2>' + (p.first || '') + ' ' + (p.last || '') + '</h2>' +
    '<div class="sub">@' + (p.username || '') + ' · ' + (p.ethnicity || '') + ' · ' + (p.grade || '') + '</div></div></div>' +
    '<div class="m-tags">' +
      '<span class="tag ' + (p.gender === 'Female' ? 'girl' : (p.gender === 'Male' ? 'boy' : '')) + '">' + esc(p.gender || '') + '</span>' +
      '<span class="tag">' + esc(p.ethnicity || '') + '</span>' +
      '<span class="tag gold">' + esc(p.grade || '') + '</span>' +
      '<span class="tag pink">' + esc(p.age != null ? p.age + ' 岁' : '') + '</span>' +
    '</div><div class="m-body">' + R + '</div>';
  document.getElementById('modal').classList.add('open');
}
function closeDetail() { document.getElementById('modal').classList.remove('open'); }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeDetail(); });

fetch("data.json").then(r => r.json()).then(d => {
  const src = d.players || d;
  players = src.map(p => {
    const hScale = parseFloat(p.height || p.Height || 1);
    const cm = Math.round((60 + (hScale - 1) * 60) * 2.54);
    return {
      username: p.username, display: p.display,
      first: p.first || p.firstName, last: p.last || p.lastName,
      gender: p.gender, ethnicity: p.ethnicity, age: p.age,
      grade: p.grade, role: p.role,
      heightCm: cm, uid: p.uid,
      skin: p.skin, hairColor: p.hairColor,
      faceId: p.faceId, faceAcc: p.faceAcc, headId: p.headId,
      hairId: p.hairId, neckId: p.neckId, shoulderId: p.shoulderId,
      waistId: p.waistId, backId: p.backId,
      unif1: p.unif1, unif2: p.unif2, unifEq: p.unifEq,
      style1: p.style1, style2: p.style2, styleEq: p.styleEq,
      avatar: p.avatar
    };
  });
  render();
  const t = new Date((d.captured || Date.now()) * 1000);
  document.getElementById("sync").textContent =
    "数据快照 " + t.toLocaleString() + " · " + players.length + " 人";
}).catch(e => {
  document.getElementById("grid").innerHTML = '<div class="empty">数据加载失败: ' + esc(e.message) + '</div>';
});

document.getElementById("q").addEventListener("input", render);
</script>
</body>
</html>
